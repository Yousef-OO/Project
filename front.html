<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Movie Recommender</title>

<style>
:root{
  --bg:#0b0b0b;
  --card:#121212;
  --accent:#8B0A0A;
  --muted:#A6A6A6;
  --white:#f5f5f5;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--white);
}

.container{
  max-width:1200px;
  margin:22px auto;
  padding:16px;
}

.controls{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

input, select{
  padding:8px 12px;
  border-radius:6px;
  background:#101010;
  border:1px solid #222;
  color:var(--white);
}

button{
  background:var(--accent);
  padding:8px 16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  color:#fff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(160px,1fr));
  gap:16px;
  margin-top:24px;
}

.card{
  background:var(--card);
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  transition:.15s;
}

.card:hover{ transform:translateY(-5px); }

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:6px;
}

.card .title{
  margin-top:8px;
  font-size:15px;
  font-weight:600;
}

.card .meta{
  margin-top:3px;
  font-size:12px;
  color:var(--muted);
}

/* Popup */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:200;
}

.modal-box{
  background:#111;
  width:90%;
  max-width:650px;
  border-radius:10px;
  padding:20px;
  max-height:85vh;
  overflow-y:auto;
  position:relative;
  animation:fadeIn .25s ease-out;
}

@keyframes fadeIn{
  from{ opacity:0; transform:scale(.9); }
  to{ opacity:1; transform:scale(1); }
}

.modal-close{
  position:absolute;
  right:14px;
  top:10px;
  font-size:24px;
  cursor:pointer;
}

.modal-img{
  width:100%;
  height:300px;
  object-fit:cover;
  border-radius:8px;
}

.recs{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:12px;
}

.rec{
  width:150px;
  background:#151515;
  border-radius:8px;
  padding:8px;
  cursor:pointer;
}

.rec img{
  width:100%;
  height:170px;
  border-radius:6px;
  object-fit:cover;
}

/* Loader */
.loader-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:300;
}

.spinner{
  width:60px;
  height:60px;
  border-radius:50%;
  border:6px solid #333;
  border-top-color:var(--accent);
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}

.small{ font-size:13px; color:var(--muted); }
</style>
</head>

<body>

<div class="container">
  <h2>Movie Explorer</h2>

  <!-- SEARCH CONTROLS -->
  <div class="controls">
    <select id="genreSelect"><option value="">All genres</option></select>
    <input type="number" id="yearInput" placeholder="Year" style="width:100px;"/>
    <input type="number" step="0.1" id="ratingInput" placeholder="Rating" style="width:120px;"/>
    <button id="btnSearch">Search</button>
  </div>

  <div id="moviesGrid" class="grid"></div>
</div>

<!-- POPUP -->
<div id="movieModal" class="modal-overlay">
  <div class="modal-box">
    <span id="modalClose" class="modal-close">&times;</span>
    <div id="modalContent"></div>

    <h3 style="margin-top:16px;">Recommendations</h3>
    <div id="modalRecs" class="recs"></div>
  </div>
</div>

<!-- LOADER -->
<div id="loader" class="loader-overlay">
  <div class="spinner"></div>
</div>

<script>
const DATA_URL = "/data/db-movies.json";
const IMG_PATH = "/images/movie-category-images/";
const PLACEHOLDER = IMG_PATH + "download.jpeg";

let allMovies = [];

// loader
function showLoader(b=true){ 
  document.getElementById("loader").style.display = b ? "flex" : "none";
}

// poster getter
function getPoster(m){
  return IMG_PATH + (m.genres?.split("|")[0] || "Unknown") + ".png";
}

// load JSON once
async function loadMovies(){
  showLoader(true);
  const r = await fetch(DATA_URL);
  allMovies = await r.json();

  buildGenres();

  // 🔥 Show 200 movies at first load
  renderMovies(allMovies);

  showLoader(false);
}

// fill genres dropdown
function buildGenres(){
  const set = new Set();
  allMovies.forEach(m => m.genres.split("|").forEach(g => set.add(g)));

  const sel = document.getElementById("genreSelect");
  [...set].sort().forEach(g=>{
    const op = document.createElement("option");
    op.value=g;
    op.textContent=g;
    sel.append(op);
  });
}

// render movies from JSON (first load only)
function renderMovies(list){
  const grid = document.getElementById("moviesGrid");
  grid.innerHTML = "";

  list.slice(0,200).forEach(m=>{
    const card = document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <img src="${getPoster(m)}" onerror="this.src='${PLACEHOLDER}'"/>
      <div class="title">${m.movie_name}</div>
      <div class="meta">${m.year} • ${m.genres.replace(/\|/g, ", ")}</div>
    `;

    card.onclick = ()=> openPopup(m);
    grid.appendChild(card);
  });
}

// render model results only
function renderModelResults(list){
  const grid = document.getElementById("moviesGrid");
  grid.innerHTML = "";

  list.slice(0,50).forEach(rec=>{
    let pseudoMovie = {
      genres: rec.genres,
      movie_name: rec.title,
      year: rec.year,
      rating: rec.rating
    };

    const card = document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <img src="${getPoster(pseudoMovie)}" onerror="this.src='${PLACEHOLDER}'"/>
      <div class="title">${rec.title}</div>
      <div class="meta">${rec.year} • ${rec.genres.replace(/\|/g, ", ")} </div>
    `;

    card.onclick = ()=> openPopup(pseudoMovie);
    grid.appendChild(card);
  });
}

// SEARCH → get MODEL RESULTS
document.getElementById("btnSearch").onclick = async ()=>{
  showLoader(true);

  const genre = document.getElementById("genreSelect").value;
  const year = document.getElementById("yearInput").value || 2000;
  const rating = parseFloat(document.getElementById("ratingInput").value) || 4.0;

  const payload = {
    genre: genre,
    year: year,
    average_rating: rating
  };

  const res = await fetch("/recommend",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  });

  const data = await res.json();
  showLoader(false);

  renderModelResults(data.recommendations);
};

// open popup and show 50 recs
async function openPopup(movie){
  showLoader(true);

  const modal = document.getElementById("movieModal");
  const modalContent = document.getElementById("modalContent");
  const modalRecs = document.getElementById("modalRecs");

  modal.style.display="flex";

  modalContent.innerHTML=`
    <img src="${getPoster(movie)}" class="modal-img" onerror="this.src='${PLACEHOLDER}'"/>
    <h2>${movie.movie_name}</h2>
    <p>${movie.year} • ${movie.genres.replace(/\|/g, ", ")} </p>
  `;

  modalRecs.innerHTML="<div class='small'>Loading...</div>";

  const payload = {
    genre: movie.genres,
    year: movie.year,
    average_rating: movie.rating || 4.0
  };

  const r = await fetch("/recommend",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  });

  const data = await r.json();
  showLoader(false);

  modalRecs.innerHTML="";

  data.recommendations.slice(0,50).forEach(rec=>{
    const d = document.createElement("div");
    d.className="rec";

    d.innerHTML=`
      <img src="${IMG_PATH + rec.genres.split("|")[0] + ".png"}" onerror="this.src='${PLACEHOLDER}'"/>
      <div class="rec-title">${rec.title}</div>
      <div class="small">${rec.year} • ${rec.genres.replace(/\|/g, ", ")}</div>
      <div class="small">Sim: ${rec.distance.toFixed(3)}</div>
    `;

    d.onclick = ()=>{
      openPopup({
        genres: rec.genres,
        movie_name: rec.title,
        year: rec.year,
        rating: rec.rating
      });
    };

    modalRecs.appendChild(d);
  });
}

document.getElementById("modalClose").onclick = ()=>{
  document.getElementById("movieModal").style.display="none";
};

loadMovies();
</script>

</body>
</html>
